<ion-content [fullscreen]="true" class="splash-content">
  <div class="splash-container">
    
    <header class="top-bar">
      <span class="sector-tag"></span>
      <div class="offline-badge">
        <span class="status-dot"></span>
        <span>Offline-first</span>
      </div>
    </header>

    <main class="hero-section">
      <div class="logo-wrapper">
        <div class="outer-ring"></div>
        <svg class="tuning-fork-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="27" y="34" width="5" height="16" rx="2.5" fill="#8B6EFF"/>
          <path d="M36 24H48V60C48 66.6274 53.3726 72 60 72C66.6274 72 72 66.6274 72 60V24H84V60C84 71.1583 76.3822 80.5318 66 83.2266V92H78V102H42V92H54V83.2266C43.6178 80.5318 36 71.1583 36 60V24Z" fill="#F4F4F6"/>
          <rect x="72" y="36" width="12" height="5" fill="#8B6EFF"/>
          <rect x="72" y="45" width="12" height="5" fill="#8B6EFF"/>
          <rect x="88" y="34" width="5" height="18" rx="2.5" fill="#8B6EFF"/>
        </svg>
      </div>

      <h1 class="app-title">Tuna</h1>

      <div class="tagline-divider">
        <span class="line"></span>
        <span class="tagline-text">AFINE SEU NEGÓCIO</span>
        <span class="line"></span>
      </div>

      <p class="app-description">
        Inteligência de dados em perfeita harmonia.
      </p>
    </main>

    <footer class="bottom-section">
      <button class="cta-button" (click)="entrarNoNegocio()">
        <span>Abrir</span>
        <div class="arrow-box">
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </div>
      </button>

      <p class="security-note">
        Seus dados disponíveis, mesmo sem internet.
      </p>
    </footer>

  </div>
</ion-content>
